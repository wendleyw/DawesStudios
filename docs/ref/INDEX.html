const data=JSON.parse(document.getElementById('data').textContent),names={agency:'Agência',client:'Cliente',designer:'Designer'},$=id=>document.getElementById(id);let visible=[],current=0;const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const sections=[...new Set(data.map(x=>x.section))].sort();for(const section of sections){const option=document.createElement('option');option.value=section;option.textContent=section;$('section').append(option)}
function render(){const q=$('query').value.toLowerCase();visible=data.filter(x=>(!$('role').value||x.role===$('role').value)&&(!$('section').value||x.section===$('section').value)&&($('scrolls').checked||!x.parent)&&(!q||[x.title,x.description,x.section,x.route,...x.steps].join(' ').toLowerCase().includes(q)));$('count').textContent=visible.length+' imagens';$('empty').hidden=!!visible.length;$('grid').innerHTML=visible.map((x,i)=>`<button class="card" data-index="${i}"><img loading="lazy" src="${esc(x.file)}" alt="${esc(x.description)}"><div class="copy"><span class="tag">${names[x.role]} / ${esc(x.section)}</span><strong>${esc(x.title)}</strong><p>${esc(x.description)}</p></div></button>`).join('');}
function show(i){current=(i+visible.length)%visible.length;const x=visible[current];$('detailTitle').textContent=names[x.role]+' / '+x.title;$('large').src=x.file;$('large').alt=x.description;$('info').innerHTML=`<strong>${esc(x.section)}</strong><p>${esc(x.description)}</p><h4>Como chegar</h4><ol>${x.steps.map(s=>'<li>'+esc(s)+'</li>').join('')}</ol><h4>Rota do protótipo</h4><code>${esc(x.route)}</code><h4>Arquivo</h4><code>${esc(x.file)}</code>${x.parent?'<p>Continuação de rolagem: '+esc(x.scroll.container)+' / y='+x.scroll.y+'</p>':''}<a href="${esc(x.file)}" target="_blank">Abrir PNG original ↗</a><p class="hint">Dados fictícios. Perfil, canal e publicação devem ser preservados na reconstrução.</p>`;if(!$('detail').open)$('detail').showModal();}
$('grid').onclick=e=>{const c=e.target.closest('[data-index]');if(c)show(Number(c.dataset.index))};for(const id of ['role','section','scrolls'])$(id).onchange=render;$('query').oninput=render;$('close').onclick=()=>$('detail').close();$('prev').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if($('detail').open&&e.key==='ArrowRight')show(current+1);if($('detail').open&&e.key==='ArrowLeft')show(current-1)});render();
</script></html>
