name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Types, lint, formatting, unit tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Install media dependencies
        run: npm ci --prefix apps/media
      - name: Web gate
        run: npm run check
      - name: Production proxy and CI bootstrap checks
        run: |
          python3 -m unittest discover -s scripts/tests -v
          RUN_PROXY_INTEGRATION=1 python3 -m unittest discover -s deploy/production/tests -v
      - name: Media unit tests
        run: npm --prefix apps/media test
      - name: Production web build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55421
          NEXT_PUBLIC_MEDIA_URL: http://127.0.0.1:55430

  acceptance:
    name: Isolated database and Chromium acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - name: Guard disposable runner
        run: python3 scripts/ci-acceptance.py guard
      - name: Install browser dependencies
        run: npm ci --prefix apps/web
      - name: Install media worker dependencies
        run: npm ci --prefix apps/media
      - name: Install Chromium
        run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      - name: Install media conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Start isolated backend and provision real fixtures
        run: python3 scripts/ci-acceptance.py bootstrap
      - name: Verify canonical seed and storage
        run: python3 supabase/scripts/verify_seed.py
      - name: Database authorization and workflow tests
        run: supabase test db
      - name: Record baseline counts
        id: baseline
        run: python3 scripts/ci-acceptance.py snapshot before
      - name: Build production web application
        run: npm run build
      - name: Start production web application
        run: |
          npm run start > "$RUNNER_TEMP/dawes-web.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3003/login; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/dawes-web.log"
          exit 1
      - name: Critical role and project workflows in Chromium
        run: >-
          npm --prefix apps/web run test:e2e -- --project=chromium
          tests/e2e/workspace.spec.ts
          tests/e2e/workspace-actions.spec.ts
          tests/e2e/miro-workspace.spec.ts
          tests/e2e/miro-version-links.spec.ts
          tests/e2e/project-feedback.spec.ts
          tests/e2e/action-notifications.spec.ts
          tests/e2e/project-drive-link.spec.ts
          tests/e2e/files-actions.spec.ts
          tests/e2e/canonical-workspaces.spec.ts
      - name: Assert fixture cleanup and exact canonical dataset
        if: always() && steps.baseline.outcome == 'success'
        run: |
          python3 scripts/ci-acceptance.py snapshot after
          python3 supabase/scripts/verify_seed.py
