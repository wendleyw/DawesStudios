# Local staging override for the upstream self-hosted Supabase distribution
# (deploy/staging/.upstream/docker/docker-compose.yml + docker-compose.s3.yml).
#
# Purpose: keep every host-published port inside the reserved 56000-56999 range, bound to
# 127.0.0.1 only, under distinct container names, and patch the two storage settings the upstream
# compose file hardcodes rather than parameterizes (FILE_SIZE_LIMIT, TUS_ALLOW_S3_TAGS — see
# deploy/staging/README.md "What production.md got wrong or missing").
#
# This file changes ONLY ports/container_name/environment on upstream-defined services; it adds
# no service, image or volume of its own. `environment` mappings deep-merge by key across
# compose files (verified with `docker compose config`), so storage below lists only the two keys
# it changes. `ports` lists do NOT merge that way — by default a later file's ports are ADDED to
# the earlier file's, not replaced (verified the same way: an unbound 0.0.0.0:8000 from upstream
# survived alongside a plain 127.0.0.1 override in a throwaway test). Every `ports:` key here
# therefore carries the compose-spec `!override` tag to force replacement instead of union, which
# is the only way to both rebind a service's existing port to 127.0.0.1 and drop supavisor's
# entirely.
#
# Values (ports, passwords, keys) live in the sibling .env file generated by scripts/stage.sh
# prepare (deploy/staging/.work/.env, mode 0600, gitignored). Nothing here is a secret.

services:
  # Envoy is upstream's default API gateway (aliased "kong" on the compose network for configs
  # that still expect that hostname). It fronts /auth/v1, /rest/v1, /storage/v1, /realtime/v1 and
  # /functions/v1, and Studio at the root path — the single "Supabase URL" the app talks to.
  api-gw:
    container_name: dawes-staging-envoy
    ports: !override
      - "127.0.0.1:${STAGING_GATEWAY_PORT}:8000/tcp"

  studio:
    container_name: dawes-staging-studio

  auth:
    container_name: dawes-staging-auth

  rest:
    container_name: dawes-staging-rest

  realtime:
    container_name: dawes-staging-realtime
    # The gateway's realtime cluster (volumes/api/envoy/cds.yaml) targets the upstream container
    # name, whose first label is also the Realtime tenant (`realtime-dev`). Renaming the container
    # removed that hostname and every WebSocket handshake got a 503, so keep it as a network alias.
    networks:
      default:
        aliases:
          - realtime-dev.supabase-realtime

  imgproxy:
    container_name: dawes-staging-imgproxy

  meta:
    container_name: dawes-staging-meta

  functions:
    container_name: dawes-staging-functions

  storage:
    container_name: dawes-staging-storage
    environment:
      # Upstream hardcodes 52428800 (50 MiB) in docker-compose.yml instead of reading a variable;
      # raise it here to the production 1 GiB video ceiling (docs/operations/production.md).
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT}
      # Not wired into any upstream compose file at all (grepped the full docker/ tree — absent).
      # MinIO supports S3 object tagging (unlike R2), so this rehearsal cannot observe a tagging
      # failure either way; it only proves the setting is accepted and the upload still succeeds.
      TUS_ALLOW_S3_TAGS: "${TUS_ALLOW_S3_TAGS}"

  # Supavisor (the pooler). Reaching it needs a tenant-qualified username this rehearsal doesn't
  # resolve; `supabase db push` instead reaches Postgres directly through `db` below (the task's
  # explicitly named alternative), so supavisor's host ports (session-mode ${POSTGRES_PORT} and
  # transaction-mode ${POOLER_PROXY_PORT_TRANSACTION}, both otherwise defaulting to the blocked
  # 5432/6543) are dropped entirely rather than rebound to an unused 56000s port. It keeps running
  # on the compose network, unpublished, for anything else in the stack that expects it.
  supavisor:
    container_name: dawes-staging-pooler
    ports: !override []

  # Upstream publishes no host port for `db` at all (Postgres is reached through the pooler only).
  # `supabase db push` needs a direct URL, so this adds one 127.0.0.1-only port — the task's
  # explicitly named alternative to resolving the pooler's tenant-qualified connection user.
  # Container-side stays the literal 5432 that `db` listens on internally (this override never
  # changes ${POSTGRES_PORT} itself, only whether/where it is published to the host).
  db:
    container_name: dawes-staging-db
    ports: !override
      - "127.0.0.1:${STAGING_DB_PORT}:5432"

  minio:
    container_name: dawes-staging-minio
    ports: !override
      - "127.0.0.1:${STAGING_MINIO_API_PORT}:9000"
      - "127.0.0.1:${STAGING_MINIO_CONSOLE_PORT}:9001"

  minio-createbucket:
    container_name: dawes-staging-minio-createbucket
